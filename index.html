<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ôn tập Chương 1: Khái niệm, đối tượng, phương pháp nghiên cứu và ý nghĩa học tập. Biên soạn: TS. Bùi Văn Như">
<meta name="author" content="TS. Bùi Văn Như">
<title>Sổ Tay Nhập Môn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
 --bg:#F7F6EF;--surface:#FFFFFF;--surface2:#EAF2F1;--ink:#12302F;--muted:#58706E;--line:#D5E0DD;
 --acc:#0E5A63;--acc-ink:#FFFFFF;--acc2:#E9A817;--acc2-soft:#FDF1CF;--acc2-ink:#6A4A00;
 --t0:#0E5A63;--t1:#C07A00;--t2:#8B3A62;--t3:#3C6E2F;
 --ok:#1D7A4B;--ok-soft:#DDF3E6;--bad:#B63A2B;--bad-soft:#FBE3DF;
 --display:"Fraunces",Georgia,"Times New Roman",serif;--serif:"Fraunces",Georgia,serif;--sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
 --r:14px;--r2:10px;--bg:#EEF7F6;--blob1:rgba(79,196,190,.35);--blob2:rgba(255,196,120,.38);--blob3:rgba(120,160,255,.28);--blob4:rgba(255,140,150,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1B1C;--surface:#132628;--surface2:#1A3336;--ink:#E7F1EF;--muted:#9DB8B4;--line:#27403F;--acc:#4FC1C8;--acc-ink:#062224;--acc2:#F2C14E;--acc2-soft:#3A3016;--acc2-ink:#F8DC93;--t0:#4FC1C8;--t1:#E9B04A;--t2:#D98AB3;--t3:#8CC77A;--ok:#5FD39A;--ok-soft:#133423;--bad:#F08577;--bad-soft:#3B1D1A;--blob1:rgba(79,193,200,.16);--blob2:rgba(242,193,78,.12);--blob3:rgba(110,140,255,.12);--blob4:rgba(255,120,140,.08);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1B1C;--surface:#132628;--surface2:#1A3336;--ink:#E7F1EF;--muted:#9DB8B4;--line:#27403F;--acc:#4FC1C8;--acc-ink:#062224;--acc2:#F2C14E;--acc2-soft:#3A3016;--acc2-ink:#F8DC93;--t0:#4FC1C8;--t1:#E9B04A;--t2:#D98AB3;--t3:#8CC77A;--ok:#5FD39A;--ok-soft:#133423;--bad:#F08577;--bad-soft:#3B1D1A;--blob1:rgba(79,193,200,.16);--blob2:rgba(242,193,78,.12);--blob3:rgba(110,140,255,.12);--blob4:rgba(255,120,140,.08);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.panel{display:grid;gap:16px;padding-block:6px 10px}
.phead{display:grid;gap:4px}
.phead .pkick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.phead h2{margin:0;font-family:var(--display);font-size:clamp(24px,3.2vw,34px);line-height:1.15;color:var(--ink)}
.lead{margin:0;color:var(--muted);max-width:70ch}
.sum-lead{margin:0;font-size:17px;max-width:72ch}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r,14px);padding:18px;display:grid;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.meta2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--muted)}
.lv{padding:2px 9px;border-radius:999px;font-weight:800;font-size:12px}
.lv-NB{background:var(--lvNBb,#E4ECFF);color:var(--lvNB,#2F4FB5)}.lv-TH{background:var(--lvTHb,#FFF0D2);color:var(--lvTH,#9A5B00)}.lv-VD{background:var(--lvVDb,#DDF5EA);color:var(--lvVD,#0F7A4E)}.lv-VDC{background:var(--lvVDCb,#FDE0EC);color:var(--lvVDC,#A3195B)}
.qtext{margin:0;font-size:18px;font-weight:600;line-height:1.45}
.card-q{margin:0;font-family:var(--serif);font-size:21px;font-weight:700;text-align:center;line-height:1.4;padding:6px 4px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r2,10px);padding:11px 13px;cursor:pointer}
.opt.w{width:auto}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt .kk{font-weight:800;min-width:20px;color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--surface2);box-shadow:0 0 0 2px var(--acc) inset}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.exp{border-left:4px solid var(--acc2);background:var(--surface2);padding:10px 13px;border-radius:0 10px 10px 0;font-size:15px}
.exp strong{display:block}
.warn{display:block;margin-top:6px;color:var(--bad);font-style:normal;font-weight:600}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}.mut{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.center{justify-content:center}.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:var(--r2,10px);padding:10px 16px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn[disabled]{opacity:.4;cursor:default}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.result{border-radius:var(--r,14px);padding:22px;background:var(--res-bg,var(--acc));color:var(--res-ink,var(--acc-ink));display:grid;gap:6px}
.result .rt{font-weight:700;opacity:.9}
.result .big{font-family:var(--display);font-size:56px;line-height:1;font-weight:700}
.result .big span{font-size:.55em;opacity:.8}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.chip b{color:var(--acc)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys span{font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r,14px);overflow:hidden}
.pillar-head{display:flex;gap:14px;align-items:center;padding:14px 18px;background:var(--tc);color:#fff}
.pillar-head .n{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.pillar-head h3{margin:0;font-size:18px;line-height:1.3}
.pillar-body{padding:16px 18px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px 28px}
.pillar-body h4{margin:0 0 6px;color:var(--tc);font-size:15px}
.pillar-body ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px}
.pillar-body li::marker{color:var(--tc)}
.pillar.p0{--tc:var(--t0)}.pillar.p1{--tc:var(--t1)}.pillar.p2{--tc:var(--t2)}.pillar.p3{--tc:var(--t3)}
/* self check */
.checks{display:grid;gap:10px}
.chk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2,10px);padding:12px 14px;display:grid;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.delta{font-size:13px;color:var(--muted)}.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}.eq{font-weight:700}
/* flash */
.flash-wrap{perspective:1400px}
.flash{position:relative;width:100%;min-height:260px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.flash.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r,16px);padding:24px;display:grid;place-content:center;gap:12px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:var(--card-front,var(--acc));color:var(--acc-ink)}
.face.front .q{font-family:var(--serif);font-size:clamp(20px,3vw,27px);font-weight:700;line-height:1.3}
.face.front .hint{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
.face.back{background:var(--surface);border:2px solid var(--acc);transform:rotateY(180deg)}
.face.back .a{font-size:17px;line-height:1.55;text-align:left}
.face.back .m{justify-self:center;background:var(--acc2-soft,#FFF0D2);color:var(--acc2-ink,#6B4200);font-weight:800;border-radius:999px;padding:6px 14px;font-size:14px}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mcol h4{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r2,10px);padding:10px 12px;text-align:left;cursor:pointer;font-weight:600;font-size:15px;line-height:1.35}
.tile.q{font-family:var(--serif);font-style:italic}
.tile.sel{border-color:var(--acc);background:var(--surface2)}
.tile.done{border-color:var(--ok);background:var(--ok-soft);cursor:default;opacity:.8}
.tile.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* sort bins */
.bins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.bins .opt{justify-content:center;text-align:center;font-weight:800;min-height:60px;align-items:center}
.bins .opt:not(.right):not(.wrong).b0{border-color:var(--t0);color:var(--t0)}
.bins .opt:not(.right):not(.wrong).b1{border-color:var(--t1);color:var(--t1)}
.bins .opt:not(.right):not(.wrong).b2{border-color:var(--t2);color:var(--t2)}
.bins .opt:not(.right):not(.wrong).b3{border-color:var(--t3);color:var(--t3)}
/* order */
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;min-height:46px;border:1.5px dashed var(--line);border-radius:var(--r2,10px);padding:8px 12px;background:var(--surface)}
.slot .sn{font-weight:800;color:var(--acc)}
.slot .st i{color:var(--muted)}
.slot.fill{border-style:solid;border-color:var(--ink);cursor:pointer}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}.slot.no{border-color:var(--bad);background:var(--bad-soft)}
.slot .yr{font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.hint2{margin:0;font-size:14px;color:var(--muted)}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--acc);color:var(--acc);text-align:center;font-weight:800;padding:0 4px}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tfb .opt{justify-content:center;font-weight:800;font-size:18px}
/* confidence */
.conf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:var(--r2,10px);background:var(--surface2);font-size:14px;font-weight:700}
.conf .cf{border:0;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;color:#fff}
.cf.c0{background:#1F7A4D}.cf.c1{background:#B7791F}.cf.c2{background:#6B6B80}
.cal{display:grid;gap:10px}.cal h3{margin:0}
.calg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.cc{border-radius:var(--r2,10px);padding:14px;display:grid;gap:2px;border:1px solid var(--line);background:var(--surface)}
.cc b{font-family:var(--display);font-size:34px;line-height:1}
.cc small{color:var(--muted)}
.cc.good{border-left:6px solid #1F7A4D}.cc.luck{border-left:6px solid #B7791F}.cc.miss{border-left:6px solid #C0392B}.cc.gap{border-left:6px solid #6B6B80}
/* story */
.story .stxt{margin:0;font-family:var(--serif);font-size:17px;line-height:1.6;padding:10px 14px;border-left:3px solid var(--acc2);background:var(--surface2);border-radius:0 8px 8px 0}
/* exam */
.exh{margin:0;font-family:var(--display);color:var(--acc)}
.timer{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.navnum{display:flex;flex-wrap:wrap;gap:6px}
.navnum button{width:34px;padding:4px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}
.navnum button.on{background:var(--ink);color:var(--bg)}.navnum button.ans{background:var(--surface2)}
.review{display:grid;gap:10px}
.review .item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px}
.review p{margin:6px 0}
/* cases & reflect */
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r,14px);padding:18px;display:grid;gap:8px}
.case h3,.case p{margin:0}
.case .tag{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.case ol,.case ul{margin:0;padding-left:22px;display:grid;gap:4px}
details summary{cursor:pointer;font-weight:700;color:var(--acc)}
.refl{display:grid;gap:12px}
.rf{display:grid;gap:6px;font-weight:600}
.rf textarea{font:inherit;font-weight:400;padding:10px 12px;border-radius:var(--r2,10px);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
/* timeline diary */
.route{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.stop{flex:1 0 120px;display:grid;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r2,10px);padding:10px 12px;cursor:pointer;position:relative}
.stop .yr{font-family:var(--display);font-weight:700;color:var(--acc);font-size:17px}
.stop .nm{font-size:13px;color:var(--muted);line-height:1.3}
.stop.seen{border-color:var(--acc2)}
.stop.on{background:var(--acc);border-color:var(--acc)}.stop.on .yr,.stop.on .nm{color:var(--acc-ink)}
.diary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r,14px);padding:18px;display:grid;gap:12px}
.d-head{display:grid;gap:2px}.d-yr{font-family:var(--display);font-size:32px;font-weight:700;color:var(--acc);line-height:1}
.d-head h3{margin:0;font-size:19px}
.evs{margin:0;padding:0;list-style:none;display:grid;gap:8px;border-left:2px solid var(--acc2);padding-left:14px}
.evs li{display:grid;grid-template-columns:150px 1fr;gap:10px;position:relative}
.evs li::before{content:"";position:absolute;left:-20px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--acc2)}
.evs .d{font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.insight{background:var(--surface2);border-radius:10px;padding:10px 12px}
.insight p{margin:8px 0 0}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (max-width:640px){.match{grid-template-columns:1fr}.evs li{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* explainer cards */
.xcards{display:grid;gap:10px}
.xc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r,14px);overflow:hidden;transition:box-shadow .2s}
.xc.open{box-shadow:0 12px 28px -22px rgba(0,0,0,.5);border-color:var(--acc)}
.xc-h{width:100%;display:grid;grid-template-columns:44px 1fr 28px;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:14px 16px;cursor:pointer}
.xc-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--acc);font-weight:800;font-size:20px}
.xc.open .xc-ic{background:var(--acc);color:var(--acc-ink)}
.xc-t{display:grid;gap:2px}.xc-t b{font-size:16.5px}.xc-t small{color:var(--muted);font-size:14px;line-height:1.4}
.xc-ar{font-size:24px;font-weight:700;color:var(--acc);text-align:center}
.xc-b{padding:0 16px 16px 72px;display:grid;gap:10px;font-size:15.5px}
.xc-b p{margin:0}
.xc-b blockquote,.ptl-d blockquote,.intl-card blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--acc2);background:var(--surface2);border-radius:0 8px 8px 0;font-family:var(--serif);font-style:italic}
.xc-ex{background:var(--acc2-soft);color:var(--ink);border-radius:10px;padding:8px 12px}
.remember{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--surface2);border-radius:var(--r2,10px);padding:12px 14px;border:1px dashed var(--acc)}
.remember b{color:var(--acc);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
@media (max-width:560px){.xc-b{padding-left:16px}}
/* party timeline */
.ptl-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.ptl-h{margin:0 0 10px;font-size:16px;color:var(--acc)}
.ptl-list{list-style:none;margin:0;padding:0 0 0 22px;position:relative;display:grid;gap:8px}
.ptl-list::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc2))}
.ptl-i{position:relative}
.ptl-dot{position:absolute;left:-22px;top:14px;width:17px;height:17px;border-radius:50%;background:var(--surface);border:3px solid var(--acc)}
.ptl-i.big .ptl-dot{background:var(--acc2);border-color:var(--acc2);box-shadow:0 0 0 4px var(--acc2-soft)}
.ptl-btn{width:100%;display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r2,10px);padding:10px 12px;cursor:pointer}
.ptl-i.open .ptl-btn{border-color:var(--acc);border-bottom-left-radius:0;border-bottom-right-radius:0}
.ptl-y{font-family:var(--display);font-weight:700;font-size:20px;color:var(--acc);font-variant-numeric:tabular-nums}
.ptl-e{font-weight:700;line-height:1.3}
.ptl-tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--acc2);color:#2A1A00;border-radius:999px;padding:2px 8px}
.ptl-d{border:1px solid var(--acc);border-top:0;border-radius:0 0 10px 10px;padding:10px 12px 12px;background:var(--surface);display:grid;gap:8px;font-size:15px}
.ptl-d p{margin:0}.ptl-why{color:var(--muted)}
.intl{position:sticky;top:90px;display:grid;gap:10px;background:linear-gradient(160deg,#1C4E80,#2A6FA8);color:#F2F7FC;border-radius:var(--r,14px);padding:16px}
.intl-badge{justify-self:start;background:#fff;color:#1C4E80;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:4px 12px}
.intl-note{margin:0;font-size:13.5px;opacity:.9}
.intl-card{background:rgba(255,255,255,.1);border-radius:12px;padding:12px;display:grid;gap:6px}
.intl-card h4{margin:0;font-size:16px}.intl-card p{margin:0;font-size:14.5px}
.intl-y{font-family:var(--display);font-size:26px;font-weight:700;color:#FFD877;line-height:1}
.intl-card blockquote{background:rgba(0,0,0,.18);border-color:#FFD877;color:#fff}
@media (max-width:820px){.ptl-wrap{grid-template-columns:1fr}.intl{position:static}}
/* concept map */
.cmap{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r,14px);padding:18px}
.cm-top{display:grid;grid-template-columns:1fr minmax(150px,220px) 1fr;gap:12px;align-items:center}
.cm-n{display:grid;gap:4px;text-align:center;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 12px;cursor:pointer}
.cm-n b{font-size:16px}.cm-n small{color:var(--muted);font-size:13px;line-height:1.35}
.cm-n.big{padding:22px 14px}.cm-n.big b{font-family:var(--display);font-size:clamp(18px,2.4vw,24px)}
.cm-n.a{border-color:var(--acc);}.cm-n.b{border-color:var(--acc2)}
.cm-n.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.cm-n.on small{color:inherit;opacity:.85}
.cm-arrows{display:grid;gap:10px}
.cm-ar{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--surface2);border-radius:999px;padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer;line-height:1.25}
.cm-ar i{font-style:normal;font-size:20px;color:var(--acc)}
.cm-ar.on{background:var(--acc2);color:#2A1A00}.cm-ar.on i{color:#2A1A00}
.cm-mid{text-align:center;position:relative}
.cm-mid span{display:inline-block;background:var(--surface);padding:0 10px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);position:relative;z-index:1}
.cm-mid::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed var(--line)}
.cm-bot{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cm-panel{background:var(--surface2);border-radius:var(--r,14px);padding:14px 16px;min-height:80px}
.cm-panel h3{margin:0 0 6px;color:var(--acc)}.cm-panel ul{margin:0;padding-left:20px;display:grid;gap:6px}.cm-panel p{margin:0}
@media (max-width:680px){.cm-top{grid-template-columns:1fr}.cm-arrows{grid-template-columns:1fr 1fr}.cm-bot{grid-template-columns:1fr}}
.pillar-body li b{font-weight:800;color:var(--tc);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--tc) 16%,transparent) 62%);padding:0 2px}

body{background:var(--bg) fixed;background-image:radial-gradient(40% 50% at 8% 12%,var(--blob1),transparent 70%),radial-gradient(38% 45% at 92% 20%,var(--blob2),transparent 70%),radial-gradient(45% 50% at 70% 95%,var(--blob3),transparent 70%),radial-gradient(35% 40% at 15% 85%,var(--blob4),transparent 70%);background-attachment:fixed;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1180px;margin:0 auto}
/* cover */
.cover{margin-top:20px;position:relative;display:grid;grid-template-columns:44px 1fr;border-radius:18px;overflow:hidden;background:linear-gradient(120deg,#0B4F57 0%,#0E6B72 50%,#128C86 100%);color:#F6F3E8;box-shadow:0 22px 44px -26px rgba(8,50,56,.8)}
.spine{background:#0A444B;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding-block:14px}
.spine i{width:14px;height:14px;border-radius:50%;background:#F7F6EF;box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.cv{padding:24px 26px 20px;display:grid;gap:12px;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.07) 31px 32px)}
.cv-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cv .eb{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#BFE3E0}
.cv .tag{background:#E9A817;color:#2B1C00;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:4px 14px;border-radius:6px;transform:rotate(-2deg)}
.cv h1{margin:0;font-family:var(--display);font-weight:700;line-height:1.15;font-size:clamp(24px,3.8vw,42px);text-wrap:balance}
.cv h1 .hl{background:linear-gradient(transparent 62%,rgba(233,168,23,.55) 62%);padding:0 4px}
.cv .sub{margin:0;color:#D6ECE9;max-width:70ch}
.cv blockquote{margin:4px 0 0;padding:10px 14px;border-left:4px solid #E9A817;background:rgba(0,0,0,.14);border-radius:0 8px 8px 0;font-family:var(--serif);font-size:clamp(15px,1.8vw,19px);line-height:1.45}
.cv blockquote cite{display:block;margin-top:4px;font-family:var(--sans);font-style:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#BFE3E0}
.auth{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:14px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.25)}
.auth span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#BFE3E0;font-weight:700;margin-right:6px}
/* layout */
.layout{margin-top:22px;display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:12px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;max-height:calc(100vh - 24px);overflow:auto}
.side h2{margin:0 4px 4px;font-family:var(--display);font-size:18px}
.side .prog-all{font-size:13px;color:var(--muted);margin:0 4px 6px;font-weight:600}
.side .prog-all b{color:var(--acc)}
.tabs{min-width:0;list-style:none;margin:0;padding:0;display:grid;gap:3px}
.tabs button{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.tabs button:hover{background:var(--surface2)}
.tabs button[aria-current="true"]{background:var(--acc);color:var(--acc-ink)}
.tabs .no{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface2);color:var(--acc)}
.tabs button[aria-current="true"] .no{background:rgba(255,255,255,.2);color:inherit}
.tabs .sg{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tabs .stars{font-size:11px;color:var(--acc2);letter-spacing:.05em}
.tabs .stars i{font-style:normal;opacity:.3}
.tabs .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted);padding:8px 8px 2px}
.fsbtn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--acc2);color:#2B1C00}
.fsbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.content{min-width:0;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:0 16px 40px -34px rgba(8,50,56,.7)}
.content .phead{padding-bottom:10px;border-bottom:2px solid var(--acc2)}
.content .box,.content .pillar,.content .case,.content .chk{background:var(--bg)}
.result{--res-bg:linear-gradient(135deg,#0E5A63,#137A74);--res-ink:#fff}
body.focus .cover,body.focus footer{display:none}
body.focus .layout{grid-template-columns:220px 1fr}
body.focus .qtext,body.focus .card-q{font-size:clamp(20px,2.4vw,30px)}
body.focus .opt{font-size:clamp(16px,1.6vw,21px)}
@media (max-width:900px){
 .layout{grid-template-columns:1fr;gap:12px}
 .side{position:sticky;top:0;z-index:5;max-height:none;overflow:visible;padding:8px;grid-template-columns:1fr auto;align-items:center;border-radius:12px}
 .side h2,.side .prog-all,.tabs .grp{display:none}
 .tabs{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none}
 .tabs li{flex:0 0 auto}
 .tabs button{grid-template-columns:auto auto;padding:6px 10px;white-space:nowrap}
 .tabs .stars{display:none}
 .fsbtn span{display:none}
 .content{padding:16px}
 body.focus .layout{grid-template-columns:1fr}
}
@media (max-width:560px){.cover{grid-template-columns:22px 1fr}.spine i{width:9px;height:9px}.cv{padding:18px 16px}}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=p=>p.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]/g,"");
async function open(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(pw)),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
 return new TextDecoder().decode(pt);
}
function mount(html){
 const app=document.getElementById("lockApp");app.innerHTML=html;
 app.querySelectorAll("script").forEach(old=>{const s=document.createElement("script");s.textContent=old.textContent;old.replaceWith(s);});
 document.getElementById("lockGate").remove();
}
async function tryPw(pw,silent){
 const btn=document.getElementById("gBtn"),err=document.getElementById("gErr");
 btn.disabled=true;btn.textContent="Đang mở…";err.textContent="";
 try{const html=await open(pw);
  try{if(document.getElementById("gRem").checked)localStorage.setItem(K,pw);else localStorage.removeItem(K);}catch(e){}
  mount(html);
 }catch(e){btn.disabled=false;btn.textContent="Vào bài học";if(!silent){err.textContent="Mật khẩu chưa đúng. Vui lòng thử lại.";const i=document.getElementById("gPw");i.select();}}
}
document.getElementById("gForm").addEventListener("submit",e=>{e.preventDefault();tryPw(document.getElementById("gPw").value,false);});
if(!(window.crypto&&crypto.subtle)){document.getElementById("gErr").textContent="Trình duyệt không hỗ trợ mở khóa. Hãy mở trang qua địa chỉ https (ví dụ GitHub Pages) bằng Chrome, Edge, Safari hoặc Firefox bản mới.";}
else{let saved=null;try{saved=localStorage.getItem(K);}catch(e){}if(saved)tryPw(saved,true);}
})();
